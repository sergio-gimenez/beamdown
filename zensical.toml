[project]
site_name = "Beamdown"
site_description = "PowerPoint + LaTeX Beamer, but Markdown-driven, for the agentic era. A presentation app for GNOME."
site_url = "https://beamdown.sergiogimenez.com/"
repo_url = "https://github.com/sergio-gimenez/beamdown"
repo_name = "sergio-gimenez/beamdown"
edit_uri = "edit/fork/docs/"
copyright = "Beamdown is MIT licensed, a fork of <a href=\"https://github.com/omacom/hype\">Hype</a> by David Heinemeier Hansson"
docs_dir = "docs"
site_dir = "public"
nav = [
  { "Home" = "index.md" },
  { "Get started" = "start.md" },
  { "Draft with your agent" = "agents.md" },
  { "Guide" = [
    { "The editor" = "editor.md" },
    { "Write your slides" = "write.md" },
    { "Images, video and diagrams" = "media.md" },
    { "Beamer features" = "beamer.md" },
    { "Themes and typography" = "themes.md" },
    { "Present and export" = "present.md" },
  ]},
  { "Reference" = [
    { "Keyboard shortcuts" = "shortcuts.md" },
    { "Command line and agents" = "cli.md" },
    { "Format reference" = "reference.md" },
  ]},
  { "About" = [
    { "Why Beamdown" = "why.md" },
    { "Brand guidelines" = "brand.md" },
    { "Develop" = "develop.md" },
  ]},
]
extra_css = ["stylesheets/beamdown.css"]

[project.theme]
variant = "modern"
language = "en"
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/sergio-gimenez/beamdown"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc = { permalink = true }
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji = { emoji_index = "zensical.extensions.emoji.twemoji", emoji_generator = "zensical.extensions.emoji.to_svg" }
pymdownx.highlight = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.snippets = { base_path = ["."], check_paths = true }
pymdownx.superfences = { custom_fences = [{ name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }] }
pymdownx.tabbed = { alternate_style = true }
